<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>My Library</h1>
        <button id="new-book-btn">New Book</button>
    </header>
    <!-- 表单：输入新书资料 -->
    <form id="book-form">
    <input id="title" placeholder="Title" required>     <!-- 书名 -->
    <input id="author" placeholder="Author" required>   <!-- 作者 -->
    <input id="pages" type="number" placeholder="Pages" required> <!-- 页数 -->
    <label><input id="read" type="checkbox"> Read</label>  <!-- 是否读过 -->
    <button type="submit">Add Book</button>              <!-- 提交按钮 -->
    </form>
    <!-- 用来显示所有书的容器 -->
    <div id="library"></div>

</body>
</html>
